          1

        <div
          class="flex-1 max-w-[65px] h-[4.875rem] relative bg-gainsboro-100/60 hover:bg-white/95 hover:scale-105 active:scale-95 transition-all duration-300 shadow-md cursor-pointer rounded-lg flex items-center justify-center font-sans text-xs font-bold text-black/70">
          2
        </div>
        <div
          class="flex-1 max-w-[65px] h-[4.875rem] relative bg-gainsboro-100/60 hover:bg-white/95 hover:scale-105 active:scale-95 transition-all duration-300 shadow-md cursor-pointer rounded-lg flex items-center justify-center font-sans text-xs font-bold text-black/70">
          3
        </div>

  <script>
    // 1. Define interactive global state object
    const state = {
      voting: {
        isEditing: false,
        selectedIndices: [],
        title: "Enter Title for Vote",
        events: ["Add Options"],
        votes: [0]
      },
      gameBox: {
        mode: "view", // "view" | "edit" | "published"
        name: "GAME NAME",
        link: "",
        image: "./assets/cyberpunk.png",
        players: [
          { name: "", points: 0 },
          { name: "", points: 0 },
          { name: "", points: 0 }
        ]
      }
    };

    // 2. Voting Widget functions
    window.editVotingWidget = function () {
      state.voting.isEditing = true;
      if (!state.voting.votes) state.voting.votes = state.voting.events.map(() => 0);
      if (!state.voting.selectedIndices) state.voting.selectedIndices = [];
      
      const titleInput = document.getElementById('voting-title-input');
      if (titleInput) titleInput.value = state.voting.title;
      renderVotingWidget();
    };

    window.saveVotingWidget = function () {
      const titleInput = document.getElementById('voting-title-input');
      if (titleInput) {
        state.voting.title = titleInput.value.trim() || "Constant Text Title";
      }
      state.voting.isEditing = false;
      renderVotingWidget();
    };

    window.selectVotingEvent = function (index) {
      if (!state.voting.selectedIndices) state.voting.selectedIndices = [];
      if (!state.voting.votes) state.voting.votes = state.voting.events.map(() => 0);

      const idx = state.voting.selectedIndices.indexOf(index);
      if (idx > -1) {
        state.voting.selectedIndices.splice(idx, 1);
        if (state.voting.votes[index] > 0) state.voting.votes[index]--;
      } else {
        state.voting.selectedIndices.push(index);
        state.voting.votes[index]++;
      }
      renderVotingWidget();
    };

    window.updateVotingEvent = function (index, val) {
      state.voting.events[index] = val;
    };

    window.addVotingEvent = function () {
      state.voting.events.push("New Event");
      if (!state.voting.votes) state.voting.votes = [];
      state.voting.votes.push(0);
      renderVotingWidget();
      // Scroll list to bottom
      const list = document.getElementById('voting-edit-list');
      if (list) list.scrollTop = list.scrollHeight;
    };

    window.removeVotingEvent = function (index) {
      state.voting.events.splice(index, 1);
      if (state.voting.votes) state.voting.votes.splice(index, 1);
      
      if (state.voting.selectedIndices) {
        state.voting.selectedIndices = state.voting.selectedIndices
          .filter(i => i !== index)
          .map(i => i > index ? i - 1 : i);
      }
      renderVotingWidget();
    };

    window.renderVotingWidget = function () {
      const viewEl = document.getElementById('voting-view');
      const editEl = document.getElementById('voting-edit');
      if (!viewEl || !editEl) return;

      if (state.voting.isEditing) {
        viewEl.classList.add('hidden');
        editEl.classList.remove('hidden');

        const editList = document.getElementById('voting-edit-list');
        if (editList) {
          editList.innerHTML = state.voting.events.map((event, index) => `
              <div class="flex items-center justify-between w-full py-1 hover:bg-white/5 rounded px-2 -mx-2 transition-colors">
                <div class="flex items-center gap-3.5 flex-1">
                  <img class="w-[1.125rem] h-[1.125rem] shrink-0 select-none" src="./assets/ellipse_unchecked.svg" />
                  <input type="text" oninput="updateVotingEvent(${index}, this.value)" value="${event}" class="flex-1 bg-transparent text-[0.875rem] text-white focus:outline-none font-yeseva-one border-b border-transparent focus:border-white/20 py-0.5" />
                </div>
                <button onclick="removeVotingEvent(${index})" class="text-white/60 hover:text-white cursor-pointer pl-3 pr-1 text-[1rem] flex items-center justify-center font-sans" title="Remove event">✕</button>
              </div>
            `).join('');
        }
      } else {
        editEl.classList.add('hidden');
        viewEl.classList.remove('hidden');

        const viewTitle = document.getElementById('voting-view-title');
        if (viewTitle) viewTitle.textContent = state.voting.title;

        const viewList = document.getElementById('voting-view-list');
        if (viewList) {
          const isPlaceholder = state.voting.events.length === 1 && state.voting.events[0] === "Add Options";

          if (isPlaceholder) {
            viewList.innerHTML = `
              <div onclick="editVotingWidget()" class="self-stretch flex items-center gap-3.5 cursor-pointer hover:bg-white/5 rounded px-2 -mx-2 py-1.5 transition-colors">
                <span class="w-[1.125rem] h-[1.125rem] bg-white rounded-full shrink-0 select-none border border-[#d9d9d9]/60 shadow-[0_1px_3px_rgba(0,0,0,0.15)]"></span>
                <div class="flex-1 relative inline-block font-yeseva-one text-[0.875rem] text-white truncate pr-2 select-none">Add Options</div>
              </div>
            `;
          } else {
            const totalVotes = (state.voting.votes || []).reduce((a, b) => a + b, 0);
            viewList.innerHTML = state.voting.events.map((event, index) => {
              const voteCount = (state.voting.votes && state.voting.votes[index]) || 0;
              const percent = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;
              const isChecked = (state.voting.selectedIndices || []).includes(index);
              const checkboxSrc = isChecked ? "./assets/ellipse_checked.svg" : "./assets/ellipse_unchecked.svg";

              return `
                  <div onclick="selectVotingEvent(${index})" class="self-stretch flex flex-col gap-1 cursor-pointer hover:bg-white/5 rounded-xl px-2.5 py-2 transition-colors relative isolate overflow-hidden group">
                    <!-- Row 1: Checkbox, Text, Count -->
                    <div class="flex items-center justify-between w-full z-10">
                      <div class="flex items-center gap-3.5 min-w-0">
                        <img class="w-[1.125rem] h-[1.125rem] relative shrink-0 select-none" alt="" src="${checkboxSrc}">
                        <div class="relative inline-block font-yeseva-one text-[0.875rem] text-white truncate pr-2 select-none">${event}</div>
                      </div>
                      <!-- Right: Count + Mini Avatar placeholder if voted -->
                      <div class="flex items-center gap-1.5 text-white/90 font-sans font-bold text-[0.8rem]">
                        ${voteCount > 0 ? `<span class="size-4.5 rounded-full bg-white/20 border border-white/25 flex items-center justify-center text-[0.55rem] font-bold text-white shrink-0 select-none overflow-hidden"><svg class="size-3 fill-current" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>` : ''}
                        <span>${voteCount}</span>
                      </div>
                    </div>
                    <!-- Row 2: Premium Progress Bar (Indented to align with text) -->
                    <div class="pl-[2.25rem] w-full z-10">
                      <div class="h-[6px] w-full bg-white/10 rounded-full overflow-hidden mt-1 relative">
                        <div class="h-full ${isChecked ? 'bg-white/60' : 'bg-white/20'} rounded-full transition-all duration-500 ease-out" style="width: ${percent}%"></div>
                      </div>
                    </div>
                  </div>
                `;
            }).join('');
          }
        }
      }
    };

    // 3. GameBox Widget functions
    window.handleGameBoxImageUpload = function (input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          state.gameBox.image = e.target.result;
          // Instantly update the edit backdrop preview image!
          const editImg = document.getElementById('gamebox-edit-img');
          if (editImg) editImg.src = e.target.result;

          // Set the URL text field to local placeholder
          const imgInput = document.getElementById('gamebox-image-input');
          if (imgInput) imgInput.value = "[Uploaded Local Image]";
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    window.editGameBoxWidget = function () {
      state.gameBox.mode = "edit";

      // Pre-fill input values
      const nameInput = document.getElementById('gamebox-name-input');
      const linkInput = document.getElementById('gamebox-link-input');
      const imgInput = document.getElementById('gamebox-image-input');

      if (nameInput) nameInput.value = state.gameBox.name;
      if (linkInput) linkInput.value = state.gameBox.link;
      if (imgInput) {
        if (state.gameBox.image.startsWith('data:')) {
          imgInput.value = "[Uploaded Local Image]";
        } else {
          imgInput.value = state.gameBox.image !== "./assets/cyberpunk.png" ? state.gameBox.image : "";
        }
      }

      renderGameBoxWidget();
    };

    window.saveGameBoxWidget = function () {
      const nameInput = document.getElementById('gamebox-name-input');
      const linkInput = document.getElementById('gamebox-link-input');
      const imgInput = document.getElementById('gamebox-image-input');

      if (nameInput) state.gameBox.name = nameInput.value.trim() || "GAME NAME";
      if (linkInput) state.gameBox.link = linkInput.value.trim();

      if (imgInput && imgInput.value.trim() && imgInput.value !== "[Uploaded Local Image]") {
        state.gameBox.image = imgInput.value.trim();
      }

      // Check if there is data inside players to publish, otherwise fallback to view state
      const hasPlayers = state.gameBox.players.some(p => p.name.trim() !== "");
      state.gameBox.mode = hasPlayers ? "published" : "view";
      renderGameBoxWidget();
    };

    window.updatePlayerName = function (index, val) {
      state.gameBox.players[index].name = val;
    };

    window.updatePlayerPoints = function (index, val) {
      state.gameBox.players[index].points = parseInt(val) || 0;
    };

    window.renderGameBoxWidget = function () {
      const viewEl = document.getElementById('gamebox-view');
      const editEl = document.getElementById('gamebox-edit');
      const pubEl = document.getElementById('gamebox-published');
      if (!viewEl || !editEl || !pubEl) return;

      // Sync target images with centralized state
      const viewImg = document.getElementById('gamebox-view-img');
      const editImg = document.getElementById('gamebox-edit-img');
      const pubImg = document.getElementById('gamebox-published-img');

      if (viewImg) viewImg.src = state.gameBox.image;
      if (editImg) editImg.src = state.gameBox.image;
      if (pubImg) pubImg.src = state.gameBox.image;

      // Hide all first
      viewEl.classList.add('hidden');
      editEl.classList.add('hidden');
      pubEl.classList.add('hidden');

      if (state.gameBox.mode === "edit") {
        editEl.classList.remove('hidden');

        const editPlayers = document.getElementById('gamebox-edit-players');
        if (editPlayers) {
          editPlayers.innerHTML = state.gameBox.players.map((player, index) => `
              <div class="flex items-center justify-between gap-2">
                <input type="text" oninput="updatePlayerName(${index}, this.value)" value="${player.name}" placeholder="ENTER NAME" class="flex-1 bg-black/20 border border-white/10 rounded px-2.5 py-0.5 text-[0.8rem] text-white tracking-[0.1em] uppercase focus:outline-none focus:border-white/30 font-bebas-neue" />
                <input type="number" oninput="updatePlayerPoints(${index}, this.value)" value="${player.points}" class="w-[3.5rem] bg-black/20 border border-white/10 rounded px-2.5 py-0.5 text-[0.8rem] text-white text-right font-sans focus:outline-none focus:border-white/30" />
              </div>
            `).join('');
        }
      } else if (state.gameBox.mode === "published") {
        pubEl.classList.remove('hidden');

        const pubName = document.getElementById('gamebox-published-name');
        if (pubName) pubName.textContent = state.gameBox.name;

        const pubLink = document.getElementById('gamebox-published-link');
        if (pubLink) pubLink.href = state.gameBox.link || "#";

        const rankedPlayers = [...state.gameBox.players].sort((a, b) => b.points - a.points);
        const pubPlayers = document.getElementById('gamebox-published-players');
        if (pubPlayers) {
          pubPlayers.innerHTML = rankedPlayers.map((player) => `
              <div class="flex items-center justify-between text-white uppercase text-[0.75rem] py-0.5 border-b border-white/5 last:border-b-0">
                <span>${player.name || 'ENTER NAME'}</span>
                <span class="font-sans font-bold text-[0.8rem]">${player.points}</span>
              </div>
            `).join('');
        }
      } else {
        viewEl.classList.remove('hidden');

        const viewName = document.getElementById('gamebox-view-name');
        if (viewName) viewName.textContent = state.gameBox.name;
      }
    };

    // 4. Initial renders on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      renderVotingWidget();
      renderGameBoxWidget();
    });
  </script>
</body>

</html>
