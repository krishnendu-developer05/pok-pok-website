<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meet the Culprits | Chaos Pokers</title>
    <link rel="stylesheet" href="../login/styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        /* Specific styles for the culprits page */
        body {
            overflow-x: hidden;
            overflow-y: auto;
            display: block;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 6rem 1.5rem 2rem;
        }
        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            font-style: italic;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 5px 15px rgba(8, 145, 178, 0.3);
        }
        .grand-reveal-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4rem;
        }
        .member-reveal-panel {
            width: 100%;
            min-height: calc(100dvh - 8rem);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }
        .core-member-card {
            transform-style: preserve-3d;
            width: 100%;
            max-width: 450px;
            padding: 3.5rem 2.5rem;
            background: rgba(20, 20, 30, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            opacity: 0; /* For GSAP */
            will-change: transform;
            touch-action: pan-y;
        }
        .core-member-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-cyan));
            z-index: -1;
            border-radius: 32px;
            opacity: 0.5;
            animation: borderGlow 4s ease infinite;
        }
        .core-member-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 20%), rgba(255,255,255,0.22), transparent 35%),
                linear-gradient(135deg, rgba(255,255,255,0.08), transparent 45%);
            opacity: var(--glow-opacity, 0);
            pointer-events: none;
            transition: opacity 0.25s ease;
            transform: translateZ(1px);
        }
        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        .member-image-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            padding: 10px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            animation: gradientShift 4s ease infinite;
            background-size: 200% 200%;
            margin-bottom: 2rem;
            transform: translateZ(55px);
        }
        .member-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--bg-color);
        }
        .member-name {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-align: center;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(8, 145, 178, 0.3);
            transform: translateZ(40px);
        }
        .member-role {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-pink);
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            transform: translateZ(34px);
        }
        .member-socials {
            display: flex;
            gap: 1rem;
            transform: translateZ(28px);
        }
        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 5px 15px rgba(8, 145, 178, 0.3);
        }
        .social-btn i {
            width: 20px;
            height: 20px;
        }
        .member-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
            border-radius: 3px;
            margin-bottom: 1.5rem;
            transform: translateZ(32px);
        }
        .member-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
        }

        @media (max-width: 640px) {
            body {
                align-items: flex-start;
                padding: 5.25rem 1rem 1.25rem;
            }

            .blob-container {
                filter: blur(70px);
                -webkit-filter: blur(70px);
            }

            .blob {
                opacity: 0.42;
            }

            .back-btn {
                top: 1rem;
                left: 1rem;
                right: 1rem;
                transform: none;
                width: min(13.5rem, calc(100vw - 2rem));
                margin: 0 auto;
                justify-content: center;
                padding: 0.7rem 1rem;
                font-size: 0.98rem;
                border-radius: 999px;
            }

            .back-btn:hover {
                transform: translateY(-2px);
            }

            .grand-reveal-container {
                gap: 2.5rem;
            }

            .member-reveal-panel {
                min-height: calc(100dvh - 6.5rem);
                align-items: center;
            }

            .core-member-card {
                max-width: 23rem;
                min-height: auto;
                padding: 1.6rem 1.15rem 1.35rem;
                border-radius: 24px;
                box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(255,255,255,0.08);
            }

            .core-member-card::before {
                border-radius: 26px;
                opacity: 0.42;
            }

            .member-image-wrapper {
                width: clamp(150px, 47vw, 188px);
                height: clamp(150px, 47vw, 188px);
                padding: 7px;
                margin-bottom: 1.25rem;
                transform: translateZ(34px);
            }

            .member-image {
                border-width: 3px;
            }

            .member-name {
                font-size: clamp(1.65rem, 8vw, 2.15rem);
                line-height: 1.08;
                letter-spacing: 1px;
                margin-bottom: 0.45rem;
                transform: translateZ(26px);
            }

            .member-role {
                font-size: 0.95rem;
                letter-spacing: 3px;
                margin-bottom: 1.1rem;
                transform: translateZ(22px);
            }

            .member-divider {
                width: 52px;
                height: 2px;
                margin-bottom: 1.05rem;
                transform: translateZ(20px);
            }

            .member-socials {
                gap: 0.75rem;
                transform: translateZ(18px);
            }

            .social-btn {
                width: 40px;
                height: 40px;
            }

            .social-btn i {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 380px), (max-height: 700px) {
            body {
                padding-top: 4.75rem;
            }

            .back-btn {
                top: 0.75rem;
                padding: 0.62rem 0.9rem;
            }

            .core-member-card {
                max-width: 21rem;
                padding: 1.3rem 1rem 1.15rem;
            }

            .member-image-wrapper {
                width: clamp(132px, 43vw, 164px);
                height: clamp(132px, 43vw, 164px);
                margin-bottom: 1rem;
            }

            .member-name {
                font-size: clamp(1.45rem, 7.4vw, 1.85rem);
            }

            .member-role {
                margin-bottom: 0.85rem;
            }

            .member-divider {
                margin-bottom: 0.85rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .core-member-card,
            .member-image-wrapper,
            .social-btn {
                transition-duration: 0.01ms;
                animation-duration: 0.01ms;
            }
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Animated Blobs Background -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>
    <div class="bg-noise"></div>

    <a href="../login/index.html" class="back-btn">
        <i data-lucide="arrow-left"></i>
        Back to Hub
    </a>

    <div class="grand-reveal-container">
        <section class="member-reveal-panel">
            <div class="core-member-card">
                <div class="member-image-wrapper">
                    <img src="./krishnendu.jpg" alt="Krishnendu Roy" class="member-image" onerror="this.src='https://via.placeholder.com/300x400/2a2a35/ffffff?text=Image+Missing';">
                </div>
                <div class="member-info">
                    <h4 class="member-name">KRISHNENDU ROY</h4>
                    <p class="member-role">SECRETARY</p>
                    <div class="member-divider"></div>
                    <div class="member-socials">
                        <a href="#" class="social-btn"><i data-lucide="github"></i></a>
                        <a href="#" class="social-btn"><i data-lucide="linkedin"></i></a>
                        <a href="#" class="social-btn"><i data-lucide="instagram"></i></a>
                    </div>
                </div>
            </div>
        </section>

        <section class="member-reveal-panel">
            <div class="core-member-card">
                <div class="member-image-wrapper">
                    <img src="./sohom.jpeg" alt="Soham Sarkar" class="member-image" onerror="this.src='https://via.placeholder.com/300x400/2a2a35/ffffff?text=Image+Missing';">
                </div>
                <div class="member-info">
                    <h4 class="member-name">SOHAM SARKAR</h4>
                    <p class="member-role">CO SECRETARY</p>
                    <div class="member-divider"></div>
                    <div class="member-socials">
                        <a href="#" class="social-btn"><i data-lucide="github"></i></a>
                        <a href="#" class="social-btn"><i data-lucide="linkedin"></i></a>
                        <a href="#" class="social-btn"><i data-lucide="instagram"></i></a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        lucide.createIcons();

        // Background Blobs animation
        const blobs = document.querySelectorAll('.blob');
        blobs.forEach((blob, i) => {
            gsap.to(blob, {
                x: () => gsap.utils.random(-300, 300),
                y: () => gsap.utils.random(-300, 300),
                scale: () => gsap.utils.random(0.8, 1.5),
                duration: () => gsap.utils.random(8, 15),
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut",
                delay: i * 0.5
            });
        });

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const revealCard = (card, delay = 0) => {
            const image = card.querySelector('.member-image-wrapper');
            const details = card.querySelectorAll('.member-name, .member-role, .member-divider, .social-btn');

            gsap.fromTo(card,
                { opacity: 0, scale: 0.64, rotationY: 80, rotationX: 34, z: -320, y: 80 },
                { opacity: 1, scale: 1, rotationY: 0, rotationX: 0, z: 0, y: 0, duration: 1.55, ease: "elastic.out(1, 0.45)", delay }
            );

            gsap.fromTo(image,
                { opacity: 0, scale: 0.35, rotation: -120 },
                { opacity: 1, scale: 1, rotation: 0, duration: 1.1, ease: "back.out(1.6)", delay: delay + 0.35 }
            );

            gsap.fromTo(details,
                { opacity: 0, y: 26 },
                { opacity: 1, y: 0, duration: 0.65, stagger: 0.12, ease: "power3.out", delay: delay + 0.65 }
            );
        };

        const attachTilt = (card) => {
            if (reduceMotion) return;

            const setGlow = (xPercent, yPercent, opacity) => {
                card.style.setProperty('--glow-x', `${xPercent}%`);
                card.style.setProperty('--glow-y', `${yPercent}%`);
                card.style.setProperty('--glow-opacity', opacity);
            };

            const tiltCard = (event, strength = 1) => {
                const rect = card.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                const xPercent = Math.min(Math.max((x / rect.width) * 100, 0), 100);
                const yPercent = Math.min(Math.max((y / rect.height) * 100, 0), 100);
                const rotateY = ((xPercent - 50) / 50) * 13 * strength;
                const rotateX = ((50 - yPercent) / 50) * 11 * strength;

                setGlow(xPercent, yPercent, 1);
                gsap.to(card, {
                    rotationY: rotateY,
                    rotationX: rotateX,
                    scale: event.pointerType === 'touch' ? 1.015 : 1.025,
                    duration: 0.35,
                    ease: "power2.out"
                });
            };

            const resetTilt = () => {
                setGlow(50, 20, 0);
                gsap.to(card, {
                    rotationY: 0,
                    rotationX: 0,
                    scale: 1,
                    duration: 0.65,
                    ease: "elastic.out(1, 0.45)"
                });
            };

            card.addEventListener('pointermove', (event) => {
                tiltCard(event, event.pointerType === 'touch' ? 0.7 : 1);
            });
            card.addEventListener('pointerdown', (event) => {
                card.setPointerCapture?.(event.pointerId);
                tiltCard(event, 0.75);
            });
            card.addEventListener('pointerup', resetTilt);
            card.addEventListener('pointercancel', resetTilt);
            card.addEventListener('pointerleave', resetTilt);
        };

        window.addEventListener('DOMContentLoaded', () => {
            const cards = gsap.utils.toArray('.core-member-card');

            cards.forEach((card) => {
                gsap.set(card.querySelectorAll('.member-image-wrapper, .member-name, .member-role, .member-divider, .social-btn'), { opacity: 0 });
                attachTilt(card);
            });

            if (reduceMotion) {
                gsap.set(cards, { opacity: 1, clearProps: "transform" });
                gsap.set('.member-image-wrapper, .member-name, .member-role, .member-divider, .social-btn', { opacity: 1, clearProps: "transform" });
            } else {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            revealCard(entry.target, entry.target === cards[0] ? 0.25 : 0);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.45 });

                cards.forEach((card) => observer.observe(card));
            }

            // Back button fade in
            gsap.fromTo('.back-btn',
                { opacity: 0, x: -30 },
                { opacity: 1, x: 0, duration: 0.6, ease: "power2.out", delay: 0.8 }
            );
        });
    </script>
</body>
</html>
