<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meet the Culprits | Management Team</title>
    <link rel="stylesheet" href="../login/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap');
        * { font-family: 'Outfit', sans-serif; }

        body {
            overflow: hidden;
            height: 100vh; height: 100dvh;
            padding: 0; margin: 0;
            user-select: none;
        }

        /* ── Top Bar ── */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.2rem 2.5rem;
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }

        .back-btn {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.6rem 1.4rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-color); text-decoration: none;
            font-weight: 700; font-size: 0.9rem;
            backdrop-filter: blur(12px);
            transition: all 0.35s ease;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: var(--accent-cyan);
            box-shadow: 0 4px 20px rgba(0,240,255,0.25);
            transform: translateX(-3px);
        }
        .back-btn i { width: 16px; height: 16px; }

        .page-title {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            font-weight: 800; letter-spacing: 6px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientShift 5s ease infinite;
        }

        /* ── Showcase ── */
        .showcase {
            position: relative;
            width: 100vw; height: 100vh; height: 100dvh;
            z-index: 10; overflow: hidden;
        }

        /* ── Diagonal Accent ── */
        .diagonal-accent {
            position: absolute; top: 0; right: 18%; width: 30%; height: 100%;
            background: linear-gradient(160deg, var(--accent-purple) 0%, var(--accent-cyan) 100%);
            opacity: 0.1; transform: skewX(-12deg);
            pointer-events: none; z-index: 1;
        }

        /* ── Photos Area ── */
        .photos-area {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 5; pointer-events: none;
        }

        .member-slide {
            position: absolute; top: 45%;
            display: flex; align-items: center; justify-content: center;
            transition: all 1.4s cubic-bezier(0.19, 1, 0.22, 1);
            will-change: transform, opacity, filter;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .member-slide .member-photo {
            display: block;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            transition: filter 1.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* ── Slide positions ── */
        .member-slide[data-pos="active"] {
            z-index: 10;
            left: 50%; transform: translate(-50%, -50%) scale(1);
            width: 340px; height: 480px;
            opacity: 1; filter: brightness(1);
        }
        .member-slide[data-pos="prev"] {
            z-index: 5;
            left: 18%; transform: translate(-50%, -50%) scale(0.75);
            width: 340px; height: 480px;
            opacity: 0.55; filter: brightness(0.5) saturate(0.5);
        }
        .member-slide[data-pos="next"] {
            z-index: 5;
            left: 82%; transform: translate(-50%, -50%) scale(0.75);
            width: 340px; height: 480px;
            opacity: 0.55; filter: brightness(0.5) saturate(0.5);
        }
        .member-slide[data-pos="prev2"], .member-slide[data-pos="next2"], .member-slide[data-pos="hidden"] {
            z-index: 0;
            left: 50%; transform: translate(-50%, -50%) scale(0.3);
            width: 340px; height: 480px;
            opacity: 0; pointer-events: none;
        }

        /* ── Bottom Info Strip — bottom 35% ── */
        .bottom-strip {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 35%;
            display: flex; align-items: flex-start; justify-content: space-between;
            padding: 1.5rem 3.5rem 2.5rem;
            z-index: 20;
            pointer-events: none;
            background: linear-gradient(to top, rgba(5,5,10,0.85) 0%, rgba(5,5,10,0.4) 60%, transparent 100%);
        }
        .bottom-strip > * { pointer-events: auto; }

        /* Left: Role + Name + Counter */
        .info-left {
            display: flex; flex-direction: column; gap: 0.4rem;
            max-width: 320px;
        }
        .member-role-label {
            font-size: 0.8rem; font-weight: 700;
            letter-spacing: 5px; text-transform: uppercase;
            color: var(--accent-cyan);
        }
        .member-name-label {
            font-size: clamp(1.8rem, 3.5vw, 2.8rem);
            font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase; color: #fff; line-height: 1.1;
        }
        .member-counter {
            display: flex; align-items: baseline; gap: 0.3rem;
            margin-top: 0.4rem;
        }
        .counter-current { font-size: 1.6rem; font-weight: 800; color: var(--accent-cyan); }
        .counter-sep { font-size: 0.9rem; color: rgba(255,255,255,0.35); margin: 0 0.1rem; }
        .counter-total { font-size: 0.9rem; color: rgba(255,255,255,0.35); }

        /* Center: Bio */
        .info-center {
            position: absolute;
            top: calc(45% + 255px);
            left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: flex-start;
            width: 340px; /* Matches active image width */
            z-index: 20;
        }
        .member-bio-text {
            font-size: 1.15rem; font-weight: 400;
            color: rgba(255,255,255,0.85); line-height: 1.6;
            font-style: italic; text-align: left;
            font-family: "Times New Roman", Times, serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .member-bio-text::before { content: '"'; }
        .member-bio-text::after { content: '"'; }
        .socials-bar {
            display: flex; gap: 1rem;
        }
        .social-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.6); text-decoration: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .social-btn:hover {
            background: rgba(0,240,255,0.15);
            border-color: var(--accent-cyan); color: var(--accent-cyan);
            transform: translateY(-3px) scale(1.12);
            box-shadow: 0 6px 20px rgba(0,240,255,0.3);
        }
        .social-btn i { width: 18px; height: 18px; }

        /* Right: spacer for nav arrow */
        .info-right { width: 60px; }

        /* ── Nav Arrows ── */
        .nav-arrow {
            position: absolute; top: 45%; transform: translateY(-50%);
            z-index: 30; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.7); cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nav-arrow:hover {
            background: rgba(0,240,255,0.12);
            border-color: var(--accent-cyan); color: var(--accent-cyan);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 6px 25px rgba(0,240,255,0.3);
        }
        .nav-arrow i { width: 22px; height: 22px; }
        .nav-prev { left: 1.5rem; }
        .nav-next { right: 1.5rem; }

        /* ── Progress dots ── */
        .progress-track {
            position: absolute; bottom: 0.8rem; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 25;
        }
        .progress-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.4s ease; cursor: pointer;
        }
        .progress-dot.active {
            width: 28px; border-radius: 3px;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0,240,255,0.6);
        }

        /* ── Particles ── */
        .particle {
            position: absolute; width: 3px; height: 3px; border-radius: 50%;
            background: var(--accent-cyan); opacity: 0;
            pointer-events: none; z-index: 3;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ═══════ Responsive ═══════ */

        @media (max-width: 1024px) {
            .member-slide[data-pos="active"] { width: 300px; height: 420px; }
            .member-slide[data-pos="prev"], .member-slide[data-pos="next"] { width: 300px; height: 420px; transform: translate(-50%, -50%) scale(0.65); }
            .info-center { width: 300px; top: calc(45% + 225px); }
            .bottom-strip { padding: 1.2rem 2rem 2rem; height: 35%; }
            .member-name-label { font-size: 1.6rem; }
        }

        @media (max-width: 768px) {
            .top-bar { padding: 0.8rem 1rem; }
            .back-btn { padding: 0.45rem 0.9rem; font-size: 0.78rem; }

            .member-slide { top: 40%; }
            .member-slide[data-pos="active"] { width: 260px; height: 380px; }
            .member-slide[data-pos="prev"] { left: 5%; transform: translate(0, -50%) scale(0.6); }
            .member-slide[data-pos="next"] { left: 95%; transform: translate(-100%, -50%) scale(0.6); }
            .info-center { width: 260px; top: calc(40% + 205px); align-items: center; }

            .bottom-strip {
                flex-direction: column; align-items: center;
                text-align: center; padding: 1rem 1.5rem 2rem;
                height: 42%; gap: 0.6rem;
            }
            .info-left { align-items: center; max-width: 100%; }
            .info-center { max-width: 90%; width: auto; }
            .member-bio-text { font-size: 0.8rem; text-align: center; }

            .member-name-label { font-size: 1.4rem; }
            .member-role-label { font-size: 0.7rem; letter-spacing: 3px; }
            .member-bio-text { font-size: 0.8rem; }

            .nav-prev { left: 0.5rem; }
            .nav-next { right: 0.5rem; }
            .nav-arrow { width: 40px; height: 40px; }

            .social-btn { width: 36px; height: 36px; }
            .socials-bar { gap: 0.7rem; }
        }

        @media (max-width: 480px) {
            .photos-area { height: 45%; top: 4rem; }
            .member-slide[data-pos="active"] { width: 200px; }
            .member-slide[data-pos="prev"] { width: 120px; transform: scale(0.5); opacity: 0.35; }
            .member-slide[data-pos="next"] { width: 120px; transform: scale(0.5); opacity: 0.35; }
            .bottom-strip { height: 48%; padding: 0.8rem 1rem 1.5rem; }
            .member-name-label { font-size: 1.2rem; letter-spacing: 1px; }
            .counter-current { font-size: 1.2rem; }
            .member-bio-text { font-size: 0.75rem; }
            .nav-arrow { width: 34px; height: 34px; }
            .nav-arrow i { width: 18px; height: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .member-slide { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Background -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>
    <div class="bg-noise"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="../login/index.html" class="back-btn"><i data-lucide="chevron-left"></i> Back</a>
        <div style="width:80px"></div>
    </div>

    <!-- Showcase -->
    <div class="showcase" id="showcase">
        <div class="diagonal-accent"></div>

        <!-- Particles -->
        <div class="particle" style="top:12%;left:8%"></div>
        <div class="particle" style="top:25%;left:88%"></div>
        <div class="particle" style="top:55%;left:4%"></div>
        <div class="particle" style="top:70%;left:92%"></div>
        <div class="particle" style="top:18%;left:52%"></div>
        <div class="particle" style="top:78%;left:42%"></div>

        <!-- Photos Area (top portion) -->
        <div class="photos-area" id="photosArea"></div>

        <!-- Center: Bio -->
        <div class="info-center">
            <div class="member-bio-text" id="bioText"></div>
        </div>

        <!-- Bottom Info Strip (bottom portion — no overlap) -->
        <div class="bottom-strip">
            <!-- Left: Name + Role + Counter -->
            <div class="info-left">
                <div class="member-role-label" id="roleLabel"></div>
                <div class="member-name-label" id="nameLabel"></div>
                <div class="member-counter">
                    <span class="counter-current" id="counterCurrent">01</span>
                    <span class="counter-sep">/</span>
                    <span class="counter-total" id="counterTotal">11</span>
                </div>
            </div>

            <!-- Right spacer -->
            <div class="info-right"></div>
        </div>

        <!-- Nav Arrows -->
        <button class="nav-arrow nav-prev" id="navPrev"><i data-lucide="chevron-left"></i></button>
        <button class="nav-arrow nav-next" id="navNext"><i data-lucide="chevron-right"></i></button>

        <!-- Progress Dots -->
        <div class="progress-track" id="progressTrack"></div>
    </div>

    <script>
    const MEMBERS = [
        { name: 'KRISHNENDU ROY', role: 'SECRETARY', img: './krishnendu.jpg', bio: 'The driving force behind every decision, Krishnendu leads with vision, strategy, and relentless energy.' },
        { name: 'SOHAM SARKAR', role: 'CO SECRETARY', img: './sohom.jpeg', bio: 'The steady hand beside the helm — Soham ensures nothing falls through the cracks.' },
        { name: 'SAMIM TARAFDAR', role: 'TREASURER', img: './SAMIM.jpeg', bio: 'Master of the books — Samim keeps the finances sharp and the team funded.' },
        { name: 'RITAM BISWAS', role: 'GROUP COORDINATOR', img: './Ritam.jpeg', bio: 'The glue that binds the chaos — Ritam orchestrates every moving piece with precision.' },
        { name: 'ANKIT GHOSH', role: 'EVENT ORGANIZER', img: './ANKIT.jpeg', bio: 'From concept to curtain call, Ankit turns every event into an unforgettable experience.' },
        { name: 'BAITANIK SAHA', role: 'DESIGN LEAD', img: './Baitanik.jpeg', bio: 'Where pixels meet purpose — Baitanik crafts the visual identity that defines the team.' },
        { name: 'NAVONIL PAL', role: 'TECH LEAD', img: './Navonil.jpeg', bio: 'The architect of innovation — Navonil turns ideas into reality with code and creativity.' },
        { name: 'SHUBHOJIT GHOSH', role: 'JUNIOR COORDINATOR', img: './SHUBHOJIT.jpeg', bio: 'Rising through the ranks with dedication, Shubhojit keeps the coordination seamless.' },
        { name: 'AITRI DASGUPTA', role: 'PR LEAD', img: './Aitri.jpeg', bio: 'The voice of the team — Aitri builds bridges and spreads the word with finesse.' },
        { name: 'SRINJINI MITRA', role: 'GAME ORGANIZER', img: './SRINJINI.jpeg', bio: 'The mastermind behind every game night — Srinjini brings the fun to the frontlines.' },
        { name: 'ARKAPRAVA CHOUDHURI', role: 'GAME ASSOCIATE', img: './ARKAPRAVA.jpeg', bio: 'The strategist in the shadows — Arkaprava co-pilots every gaming adventure.' }
    ];

    let activeIdx = 0, isAnimating = false;
    const TOTAL = MEMBERS.length;
    const photosArea = document.getElementById('photosArea');

    // Build slides
    MEMBERS.forEach((m, i) => {
        const slide = document.createElement('div');
        slide.className = 'member-slide';
        slide.dataset.idx = i;
        slide.dataset.pos = 'hidden';
        slide.innerHTML = `<img src="${m.img}" alt="${m.name}" class="member-photo" draggable="false" onerror="this.src='https://via.placeholder.com/400x600/1a1a2e/ffffff?text=Image';">`;
        slide.addEventListener('click', () => {
            const idx = parseInt(slide.dataset.idx);
            if (idx !== activeIdx) goTo(idx);
        });
        photosArea.appendChild(slide);
    });

    // Build progress dots
    const progressTrack = document.getElementById('progressTrack');
    MEMBERS.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        dot.addEventListener('click', () => goTo(i));
        progressTrack.appendChild(dot);
    });

    lucide.createIcons();

    // Blob animations
    document.querySelectorAll('.blob').forEach((blob, i) => {
        gsap.to(blob, {
            x: () => gsap.utils.random(-300, 300),
            y: () => gsap.utils.random(-300, 300),
            scale: () => gsap.utils.random(0.8, 1.5),
            duration: () => gsap.utils.random(8, 15),
            repeat: -1, yoyo: true, ease: "sine.inOut", delay: i * 0.5
        });
    });

    // Particle animations
    document.querySelectorAll('.particle').forEach((p, i) => {
        gsap.to(p, {
            opacity: gsap.utils.random(0.15, 0.5),
            y: gsap.utils.random(-30, 30),
            x: gsap.utils.random(-15, 15),
            duration: gsap.utils.random(3, 6),
            repeat: -1, yoyo: true, ease: "sine.inOut", delay: i * 0.3
        });
    });

    function getPos(idx) {
        let diff = idx - activeIdx;
        const half = Math.floor(TOTAL / 2);
        if (diff > half) diff -= TOTAL;
        if (diff < -half) diff += TOTAL;
        if (diff === 0) return 'active';
        if (diff === -1) return 'prev';
        if (diff === 1) return 'next';
        if (diff === -2) return 'prev2';
        if (diff === 2) return 'next2';
        return 'hidden';
    }

    function updateSlides() {
        photosArea.querySelectorAll('.member-slide').forEach((s, i) => {
            s.dataset.pos = getPos(i);
        });
    }

    function animateInfo() {
        const m = MEMBERS[activeIdx];
        const els = {
            role: document.getElementById('roleLabel'),
            name: document.getElementById('nameLabel'),
            counter: document.getElementById('counterCurrent'),
            bio: document.getElementById('bioText'),
        };

        gsap.killTweensOf([els.role, els.name, els.bio, '.member-counter']);

        gsap.timeline({
            onComplete: () => {
                els.role.textContent = m.role;
                els.name.textContent = m.name;
                els.counter.textContent = String(activeIdx + 1).padStart(2, '0');
                els.bio.textContent = m.bio;

                gsap.to(els.role, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" });
                gsap.to(els.name, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", delay: 0.1 });
                gsap.to('.member-counter', { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", delay: 0.2 });
                gsap.to(els.bio, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", delay: 0.3 });
                isAnimating = false;
            }
        })
        .to([els.role, els.name, '.member-counter', els.bio], { opacity: 0, y: -10, duration: 0.3, ease: "power2.inOut" });
    }

    function updateProgress() {
        progressTrack.querySelectorAll('.progress-dot').forEach((d, i) => d.classList.toggle('active', i === activeIdx));
    }

    function goTo(idx) {
        if (isAnimating || idx === activeIdx) return;
        isAnimating = true;
        activeIdx = ((idx % TOTAL) + TOTAL) % TOTAL;
        updateSlides();
        updateProgress();
        animateInfo();
    }

    function next() { goTo((activeIdx + 1) % TOTAL); }
    function prev() { goTo((activeIdx - 1 + TOTAL) % TOTAL); }

    document.getElementById('navNext').addEventListener('click', next);
    document.getElementById('navPrev').addEventListener('click', prev);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
    });

    let wheelT;
    document.getElementById('showcase').addEventListener('wheel', (e) => {
        if (wheelT) return;
        if (Math.abs(e.deltaY) > 30) {
            e.deltaY > 0 ? next() : prev();
            wheelT = setTimeout(() => { wheelT = null; }, 700);
        }
    }, { passive: true });

    let touchX = 0;
    const sc = document.getElementById('showcase');
    sc.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    sc.addEventListener('touchend', (e) => {
        const d = touchX - e.changedTouches[0].clientX;
        if (Math.abs(d) > 50) { d > 0 ? next() : prev(); }
    }, { passive: true });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
        updateSlides();
        updateProgress();
        const m = MEMBERS[0];
        document.getElementById('counterTotal').textContent = String(TOTAL).padStart(2, '0');
        document.getElementById('roleLabel').textContent = m.role;
        document.getElementById('nameLabel').textContent = m.name;
        document.getElementById('counterCurrent').textContent = '01';
        document.getElementById('bioText').textContent = m.bio;

        gsap.fromTo('.back-btn', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, delay: 0.2, ease: "power2.out" });
        gsap.fromTo('.page-title', { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.5, delay: 0.3, ease: "power2.out" });
        gsap.fromTo('#roleLabel', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, delay: 0.5, ease: "power3.out" });
        gsap.fromTo('#nameLabel', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, delay: 0.6, ease: "power3.out" });
        gsap.fromTo('.member-counter', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, delay: 0.7, ease: "power3.out" });
        gsap.fromTo('#bioText', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, delay: 0.75, ease: "power3.out" });
    });
    </script>
</body>
</html>
